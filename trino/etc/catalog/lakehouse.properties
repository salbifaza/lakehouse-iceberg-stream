# Reads Iceberg tables that the Fluss tiering service commits into the same
# Polaris catalog lakehouse-iceberg-batch uses. This proves data tiered by
# Fluss is a standard Iceberg table, readable by any Iceberg-compatible
# engine -- not a Fluss-proprietary format.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:ANALYST_CLIENT_ID}:${ENV:ANALYST_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.vended-credentials-enabled=true

fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1

iceberg.format-version=2
